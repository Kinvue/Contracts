syntax = "proto3";

package auth.v1;

service UserService {
  rpc GetProfile(GetProfileRequest) returns (UserDataResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserDataResponse);
}

message GetProfileRequest {
  string user_id = 1;
}

message UpdateProfileRequest {
  string user_id = 1;

  optional string name = 2;
  optional string email = 3;
  optional string password = 4;
}

message UserDataResponse {
  string id = 1;
  string name = 2;
  string email = 3;

  bool is_email_verified = 4;
  bool is_banned = 5;

  string created_at = 6;
  string updated_at = 7;
}